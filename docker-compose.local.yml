# ============================================================================
# docker-compose.local.yml — Untuk development/deployment TANPA build Flutter
#
# Frontend pakai pre-built static files dari flutter build web.
# Jalankan dulu:
#   cd flutter_app && flutter build web --release
#
# Lalu:
#   docker compose -f docker-compose.local.yml up --build -d
# ============================================================================

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:-swaap}"
      POSTGRES_USER: "${DB_USER:-swaap}"
      POSTGRES_PASSWORD: "${DB_PASS:-swaap}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-swaap} -d ${DB_NAME:-swaap}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Go Wrapper API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: swaap-backend:latest
    restart: unless-stopped
    environment:
      PORT: "8081"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-swaap}"
      DB_PASS: "${DB_PASS:-swaap}"
      DB_NAME: "${DB_NAME:-swaap}"
      DB_SSLMODE: "disable"
    networks:
      - internal
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend: Nginx serving pre-built Flutter Web ───────────────────────────
  # No Docker build needed! Uses pre-built files from ./flutter_app/build/web
  frontend:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./flutter_app/build/web:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
      - public
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend

networks:
  internal:
  public:
    driver: bridge

volumes:
  pgdata:
