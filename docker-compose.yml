services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:-swaap}"
      POSTGRES_USER: "${DB_USER:-swaap}"
      POSTGRES_PASSWORD: "${DB_PASS:-swaap}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    # Security hardening
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-swaap} -d ${DB_NAME:-swaap}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Go Wrapper API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: swaap-backend:latest
    restart: unless-stopped
    environment:
      PORT: "8081"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-swaap}"
      DB_PASS: "${DB_PASS:-swaap}"
      DB_NAME: "${DB_NAME:-swaap}"
      DB_SSLMODE: "disable"
    networks:
      - internal
    # Security hardening
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    # Never expose port 8081 to the host — Nginx proxies internally
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Flutter Web Frontend (Nginx) ────────────────────────────────────────────
  frontend:
    build:
      context: ./flutter_app
      dockerfile: Dockerfile
    image: swaap-frontend:latest
    restart: unless-stopped
    networks:
      - internal
      - public
    volumes:
      - ./flutter_app/build/web:/usr/share/nginx/html:ro
    cap_drop:
      - ALL
    read_only: true
    # nginx-unprivileged needs these tmpfs mounts to write its runtime files
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"   # Only bind to localhost — host Nginx handles HTTPS
    depends_on:
      - backend

  # ── Cloudflare Tunnel ───────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    networks:
      - public
      # Joined so the tunnel can reach SWU OSR services by hostname
      # (e.g. http://swu-osr-nginx:80) without depending on `docker network connect`.
      # - swu_osr_internal

networks:
  internal:
  public:
    driver: bridge
  # External network owned by the SWU_OSR docker compose project.
  # Must already exist before this stack starts.
  # swu_osr_internal:
  #   external: true

volumes:
  pgdata:
